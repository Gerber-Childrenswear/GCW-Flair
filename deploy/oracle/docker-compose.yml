services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ./app.env
    volumes:
      - flair_app_data:/data
    restart: unless-stopped
    networks:
      - flair_net

  caddy:
    image: caddy:2-alpine
    env_file:
      - ./oracle.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - flair_net

networks:
  flair_net:

volumes:
  caddy_data:
  caddy_config:
  flair_app_data:

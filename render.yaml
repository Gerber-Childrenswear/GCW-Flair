services:
  - type: web
    name: gcw-flair
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_SCOPES
        value: read_products,write_products,read_discounts,write_discounts
      - key: FRONTEND_URL
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
